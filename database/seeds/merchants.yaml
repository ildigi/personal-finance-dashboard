# Merchant noti (SPEC §11, "Normalizzazione dei merchant").
# `key` è la chiave normalizzata stabile; `aliases` sono le varianti con cui il merchant
# compare nelle descrizioni (confronto per parole intere, senza maiuscole e punteggiatura:
# "AMZN Mktp" e "Amazon.it" diventano entrambi Amazon).
# `category` / `subcategory`: codici del seed delle categorie (categoria predefinita,
# passo 5 della pipeline). Il seed inserisce solo i merchant mancanti: le modifiche fatte
# dall'interfaccia restano tue.

