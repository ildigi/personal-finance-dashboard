# Known merchants, in English (SEED_LOCALE=en, ADR 0006). Same keys and aliases as
# ../merchants.yaml, plus a few international chains; aliases recognise both Italian and
# English bank descriptions.
# `key` is the stable normalised key; `aliases` are the forms the merchant takes in
# descriptions (whole-word match, ignoring case and punctuation: "AMZN Mktp" and
# "Amazon.it" both become Amazon).
# `category` / `subcategory`: codes from the categories seed (default category, step 5 of
# the pipeline). The seed only adds missing merchants: changes made in the interface stay
# yours.

merchants:
  # --- Groceries ---------------------------------------------------------------------------
  - { key: esselunga, name: Esselunga, aliases: [esselunga], category: spesa }
  - { key: conad, name: Conad, aliases: [conad], category: spesa }
  - { key: coop, name: Coop, aliases: [coop, ipercoop, coop lombardia], category: spesa }
  - { key: lidl, name: Lidl, aliases: [lidl], category: spesa }
  - { key: aldi, name: Aldi, aliases: [aldi], category: spesa }
  - { key: eurospin, name: Eurospin, aliases: [eurospin], category: spesa }
  - { key: carrefour, name: Carrefour, aliases: [carrefour, carrefour express, carrefour market], category: spesa }
  - { key: pam, name: Pam, aliases: [pam panorama, pam local, pam], category: spesa }
  - { key: penny, name: Penny Market, aliases: [penny market, penny], category: spesa }
  - { key: iper, name: Iper, aliases: [iper la grande i, iper], category: spesa }
  - { key: despar, name: Despar, aliases: [despar, eurospar, interspar], category: spesa }
  - { key: unes, name: Unes, aliases: [unes, u2 supermercato], category: spesa }
  - { key: tesco, name: Tesco, aliases: [tesco], category: spesa }
  - { key: spar, name: Spar, aliases: [spar], category: spesa }

