title = "finance-dashboard"

# Regole standard di gitleaks (chiavi cloud, token, chiavi private, ...)
[extend]
useDefault = true

# Cartelle generate e ignorate da Git (ambienti virtuali, cache, dipendenze):
# non finiscono mai nel repository, quindi non vanno scansionate.
[[allowlists]]
description = "Artefatti locali ignorati da Git"
paths = [
  '''(^|[\\/])\.venv[\\/]''',
  '''(^|[\\/])__pycache__[\\/]''',
  '''(^|[\\/])\.(mypy|ruff|pytest)_cache[\\/]''',
  '''(^|[\\/])node_modules[\\/]''',
]

# Falsi positivi noti, ancorati al valore esatto:
# - il NOME del file delle credenziali Trading 212 (la chiave sta fuori dal repository);
# - le credenziali finte dei test, che iniziano sempre con FAKE.
[[allowlists]]
description = "Nomi di file e valori finti dei test"
regexTarget = "secret"
regexes = [
  '''^trading212\.env$''',
  '''^FAKE[A-Z]+[0-9]*$''',
]

# Chiavi delle traduzioni nel frontend (i18nKey="legal.privacy.consent.p1"): sono nomi di
# testi, non segreti. Vale solo per la regola generica sulle chiavi API e solo per valori
# fatti di parole minuscole separate da punti.
[[allowlists]]
description = "Chiavi delle traduzioni (i18nKey)"
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = [
  '''^i18nKey="[a-z][a-z0-9_]*(?:\.[a-z0-9_]+)+"$''',
]

# IBAN italiani e di altri paesi SEPA: non devono mai finire nel codice
[[rules]]
id = "iban"
description = "IBAN in chiaro"
regex = '''\b[A-Z]{2}[0-9]{2}(?:[ ]?[A-Z0-9]{4}){3,7}(?:[ ]?[A-Z0-9]{1,3})?\b'''
keywords = ["it", "fr", "lt", "gb", "de", "es", "nl", "be", "ie"]
[rules.allowlist]
# IBAN fittizio a zeri usato nei test (anche nella forma con spazi)
regexes = ['''IT00X0000000000000000000000''', '''IT00 X000(?: 0000){4} 000''']

# Assegnazioni di password/chiavi/token con un valore reale
[[rules]]
id = "env-secret-assignment"
description = "Valore segreto assegnato in un file"
regex = '''(?i)\b(?:password|passwd|secret|api[_-]?key|api[_-]?secret|token)\s*[:=]\s*['"]?([A-Za-z0-9+/_\-]{12,})'''
secretGroup = 1
keywords = ["password", "passwd", "secret", "api_key", "api-key", "apikey", "api_secret", "token"]
